version: 2
updates:
  # The root manifest is the single source for runtime and build dependencies.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # Review parser/runtime changes together; this does not establish compatibility.
      tree-sitter:
        patterns:
          - tree-sitter*
      packaging:
        patterns:
          - setuptools
          - wheel
  # Covers actions in every workflow, including workflows added later.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
