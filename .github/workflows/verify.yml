name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RI_REQUIRE_STANDALONE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare native test tools
        run: |
          rustup component add rust-analyzer rust-src
          rustc --version
          rust-analyzer --version
      - name: Prepare pinned Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/maintain.py prepare
      - name: Verify source and installed consumer
        run: .venv/bin/python scripts/maintain.py verify --require-native
      - name: Check whitespace and tracked source cleanliness
        run: |
          git diff --check
          git diff --exit-code
