[build-system]
requires = ["setuptools==79.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-intelligence"
version = "0.1.0"
description = "Typed repository-intelligence authority records"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
