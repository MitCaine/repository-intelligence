[build-system]
requires = ["setuptools==79.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-intelligence"
version = "0.1.0"
description = "Source-derived Python and Rust function locator for AI-assisted navigation"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-rust==0.24.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
